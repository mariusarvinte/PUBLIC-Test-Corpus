[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "runtests"
version = "0.1.0"
description = "TRACTOR test vector execution framework for running C and Rust projects"
requires-python = ">=3.11"
dependencies = ["docker", "xxhash"]

[project.scripts]
exec-test-case = "runtests.exec_test_vector.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtests*"]
namespaces = true

[tool.setuptools.package-data]
"runtests.orchestrator" = ["falco_configs/*.yaml"]
